</span>

</div>
<div style="padding: 16px; border-radius: 18px; background: #14141C; border: 1px solid #23233A; display: flex; flex-direction: column; gap: 2px">

</div>
<div style="padding: 16px; border-radius: 18px; background: #14141C; border: 1px solid #23233A; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 30px; font-weight: 600; letter-spacing: -0.03em">58 min</span>
<span style="font-size: 13px; color: #A7A7BC">on the road</span>

<div style="padding: 16px; border-radius: 18px; background: #14141C; border: 1px solid #23233A; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 30px; font-weight: 600; letter-spacing: -0.03em">11</span>
<span style="font-size: 13px; color: #A7A7BC">songs in sync</span>

</div>

<div style="padding: 16px; border-radius: 20px; background: #1A1736; border: 1px solid #3A3275; display: flex; flex-direction: column; gap: 8px">
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #C8C2FF">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B0A6FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h3l9 5V5L7 10H4z"></path></svg>
From the organiser</span>
<p style="margin: 0; font-size: 18px; font-weight: 500; line-height: 1.4">Thank you for lighting up the streets tonight. Chag sameach!</p>

</div>
